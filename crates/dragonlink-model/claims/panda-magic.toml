accessed = "2026-10-13"
scope = "cabinet-au, Queensland clubs"
note = "Read from footage in one pass by one reader; not yet re-read independently. The four-line frame at $1 shows that lines can be reduced. Payline shapes are not found. See claims/family.toml, structure.lines-au and structure.lines-by-denomination-au. The US rules page says 50 lines are played."

[[claim]]
id = "symbols"
statement = "The symbol set, described in our words from the US rules screens."
value = "scatter: a red lantern; pictures, highest first: a tiger, a rooster, a junk, a lotus; king, queen, jack, ten, nine; wild: a panda; and the Hold & Spin prize symbol"
