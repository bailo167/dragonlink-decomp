[[claim]]
id = "paytable"
statement = "The US pay table, as its rules screen shows it with the bet multiplier at 1."
value = "per credit bet on the line, for 5 / 4 / 3 of a kind: top picture 150 / 50 / 10 and 2 for two; second picture 100 / 30 / 5; third and fourth pictures 100 / 25 / 5; king 75 / 20 / 5; queen, jack, ten, nine 50 / 10 / 5; scatter, anywhere, 100 / 15 / 2 times the total bet"
confidence = "strong_evidence"
source = "gameplay_recording"
citation = "Public recordings, YouTube ids and times: YDEY30OkUDU 0:21.8; 3b4aunoThEY 0:17.0 (docs/reverse-engineering/FOOTAGE.md)"
accessed = "2026-10-13"
scope = "cabinet-us"
note = "Read from footage in one pass by one reader; not yet re-read independently. Read in two recordings, of 2018 and 2023. Happy & Prosperous, Panda Magic and Autumn Moon show the same pay table under different artwork, and it is the one quoted without a title in the complaint. The pay table as displayed on an Australian machine has not been found. One Australian observation agrees: three scatters paid twice the total bet (nYM0NGR3px0 3:48)."

[[claim]]
id = "paytable.au-club"
statement = "Australian club machines pay Autumn Moon's line wins by the mobile build's pay table, not the US one."
value = "rabbit 250 / 50 / 10 / 3 for 5 / 4 / 3 / 2; mooncake 150 / 30 / 5 / 2; fan and lute 100 / 25 / 5 / 2; king 75 / 20 / 5; queen, jack, ten, nine 50 / 10 / 5; the moon 100 / 10 / 2 times the total bet"
confidence = "strong_evidence"
source = "gameplay_recording"
citation = "Mobile help screens (official mobile, Autumn Moon help.mercury); Australian club wins: y6fTKsqfa_4 1:09 (two fans pay 2), 1:18.8 (two rabbits pay 3); cXHGn3T7eyg 19:08.2 (two lutes pay 2), five rabbits paying 250 (from the commentary) (research notes, 2026-10-19)"
accessed = "2026-10-19"
scope = "cabinet-au, Queensland and Victorian clubs"
note = "Four club wins fit the mobile table and none fits the US table (claim paytable: two rabbits pay 2 there, two fans and two lutes nothing). Read by one reader; the club pay table itself was never filmed. The mobile build otherwise gives Autumn Moon Golden Century's rules and feature scenes byte for byte."

