# Mathematics
# ---------------------------------------------------------------------------

[[claim]]
id = "math.not-public"
statement = "Aristocrat treats the mathematical design as a trade secret and states that it is not publicly disclosed: reel strip layouts, hit rates, probabilities and return percentages, Hold & Spin calculations for every denomination, and Grand and Major jackpot hit rates and average prizes. Rules, denominations and pay tables are visible to players."
value = "mathematics asserted as trade secret; rules, denominations and pay tables player-visible"
confidence = "verified"
source = "court_record"
citation = "Order pp. 2 and 6-7"
accessed = "2026-10-13"
scope = "cabinet-us"
note = "What the court's order records of Aristocrat's position and its witnesses' declarations. It is why the questions below are open, and why recovered mathematics is kept out of this repository by default (docs/DECISIONS.md D-010)."

[[claim]]
id = "math.reel-strips"
statement = "What are the reel strips (symbol order and length per reel) of each title and bet configuration?"
confidence = "unknown"
note = "No cabinet software, par sheet or regulatory math document is held. Official mobile software, if analysed, describes the mobile implementation only."

[[claim]]
id = "math.rtp"
statement = "What is the theoretical return to player of each title, per denomination and jurisdiction?"
confidence = "unknown"
note = "No figure was found in any regulatory or official source. The national standard requires the machine's own information screen to show RTP or its range, which makes footage of that screen the most direct lawful source."

[[claim]]
id = "math.rng"
statement = "Which random number generator and mapping from random numbers to reel stops does the cabinet software use?"
confidence = "unknown"
note = "The deterministic generators in dragonlink-core are test instruments of this project and model nothing about the original."

