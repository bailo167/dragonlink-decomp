# Claims about the Dragon Link family as a whole.
#
# One [[claim]] per statement. Rules (enforced by `cargo test -p dragonlink-model`):
#   * confidence = "unknown"  -> an open question; no `value`.
#   * any other confidence     -> `value`, `source`, and (unless the source is our own
#                                 "hypothesis") a `citation` with an `accessed` date.
#   * "verified" needs a primary source class (cabinet, regulatory, official_mobile,
#     official_media, court_record, gameplay_recording).
#   * source = "hypothesis" is our own conjecture and stays at "hypothesis".
# Labels are defined in docs/EVIDENCE.md. Prose and context: docs/reverse-engineering/.
#
# Convention used below: "verified" means the passage was read in the primary document in
# two independent passes on the access date; "strong_evidence" on a primary source means it
# was read once and has not been re-checked.
#
# `scope` matters. `cabinet-us` statements come from Aristocrat's US complaint and describe
# the US Dragon Link family generically; whether each holds for the Australian builds of the
# four titles is recorded separately in the per-title files.
#
# Citation keys:
#   Complaint = Aristocrat Technologies, Inc. v. Light & Wonder, Inc., D. Nev. 2:24-cv-00382, ECF 1 (26 Feb 2024)
#               https://storage.courtlistener.com/recap/gov.uscourts.nvd.167218/gov.uscourts.nvd.167218.1.0_1.pdf
#   Order     = same case, ECF 125, order granting preliminary injunction (20 Sep 2024)
#               https://storage.courtlistener.com/recap/gov.uscourts.nvd.167218/gov.uscourts.nvd.167218.125.0.pdf
#   ACT NI    = ACT notifiable instrument under the Gaming Machine Act 2004,
#               https://www.legislation.act.gov.au/DownloadFile/ni/<NI>/current/PDF/<NI>.PDF

