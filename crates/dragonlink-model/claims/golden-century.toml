[[claim]]
id = "scatter.top-pay"
statement = "The manufacturer's pages say a scatter win pays up to 250 times the bet."
value = "up to 250x bet, as marketed"
confidence = "strong_evidence"
source = "official_media"
citation = "https://www.aristocratgaming.com/asia/games/asia-dragon-link-golden-century ; https://www.aristocratgaming.com/us/games/us-dragon-link ; Aristocrat's Australian title page for this title (aristocrat.com/anz/games), Internet Archive captures 2020 to 2023 (docs/reverse-engineering/AUSTRALIAN_CONFIGURATION.md)"
accessed = "2026-10-13"
scope = "marketing pages (Asia, US, Australia)"
note = "What the pages say, not what a screen shows. The same sentence is on the Australian pages of all four titles. No screen read from footage shows a scatter pay of 250: three scatters pay twice the total bet here, and the other three titles' US pay table gives 100 times the total bet for five. 250 is the largest prize-symbol multiple in the US Hold & Spin rules. The figure is unexplained."

