[[claim]]
id = "math.configuration-by-denomination"
statement = "On the machine observed, the $1 game uses different reels from the 1c, 2c, 5c and 10c games, which are consistent with sharing one set; changing the number of lines does not change the reels."
value = "share of reel windows already seen in the other set, reels 1 to 5: 10c against $1: 64, 54, 76, 42, 72 per cent; 2c against 10c: 96, 88, 92, 88, 79 per cent; $1 with 4 lines against $1 with 5 lines: 100, 100, 100, 96, 96 per cent; yardstick ($1 second half against first half): 92, 88, 93, 88, 79 per cent"
confidence = "strong_evidence"
source = "gameplay_recording"
citation = "Public recording, YouTube id y8c8lEdPW8Y, read game by game; times and counts in docs/reverse-engineering/GOLDEN_CENTURY_SESSION.md"
accessed = "2026-10-13"
scope = "cabinet-au, Queensland club, one session on one machine"
note = "Inferred statistically from windows read twice: 266 base games at $1 and 276 at the cent denominations. A comparison of what was seen, not of strips. A permutation test (4,000 random relabellings, dragonlink-analyze compare-windows) gives p = 0.0002 on every reel for $1 against 10c, the smallest it can report, and p between 0.43 and 0.97 for 10c against 2c. With paytable.varies-by-denomination it shows the $1 game to be a different configuration from the cent games on this machine. No reel strip has been assembled."

