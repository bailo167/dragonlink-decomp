# --- Features -----------------------------------------------------------------

[[claim]]
id = "hold-and-spin.rules"
statement = "On Australian machines six prize symbols start Hold & Spin; a counter of free spins remaining runs; prize symbols are collected towards fifteen for the Grand Jackpot; prizes are tallied into a total at the end."
value = "trigger: 6 prize symbols; a free-spins-remaining counter; a collected-of-15 counter for the Grand; prizes shown in credits (dollars at $1 and $2) or as a level's name; total awarded at the end"
confidence = "strong_evidence"
source = "gameplay_recording"
citation = "Public recordings, YouTube ids and times: 1bAevGz0K2k 0:18, 1:48 to 2:45; y8c8lEdPW8Y 15:11; f5sMl9a5jds 4:23 (docs/reverse-engineering/FOOTAGE.md)"
accessed = "2026-10-13"
scope = "cabinet-au"
note = "Read from footage in one pass by one reader; not yet re-read independently. On-screen prompts and behaviour: no rules page was found for this title. One tally was checked: four prizes of 500 credits, three of 1,500 and four Mini at 1c gave $105. That the counter returns to three on a new prize symbol was not isolated in Australian footage; it is stated for the US family (claims/family.toml, hold-and-spin.respins). The set of prize values and their chances are unknown."

