confidence = "partial"
source = "gameplay_recording"
citation = "Public recordings, YouTube ids and times: OxMnVxG6Yqc 0:12.9; t_g9hlCODBU 0:17.4 (docs/reverse-engineering/FOOTAGE.md)"
accessed = "2026-10-13"
scope = "cabinet-us"
note = "Read from footage in one pass by one reader; not yet re-read independently. The US rules text says the wild substitutes for all symbols except the scatter and the prize symbol and appears on reels 2, 3, 4 and 5 only. No Australian rules page was found."

[[claim]]
id = "paytable"
statement = "The US pay table, as its rules screen shows it with the bet multiplier at 1."
value = "per credit bet on the line, for 5 / 4 / 3 of a kind: top picture 150 / 50 / 10 and 2 for two; second picture 100 / 30 / 5; third and fourth pictures 100 / 25 / 5; king 75 / 20 / 5; queen, jack, ten, nine 50 / 10 / 5; scatter, anywhere, 100 / 15 / 2 times the total bet"
confidence = "strong_evidence"
source = "gameplay_recording"
citation = "Public recordings, YouTube ids and times: OxMnVxG6Yqc 0:12.9; t_g9hlCODBU 0:17.4 (docs/reverse-engineering/FOOTAGE.md)"
accessed = "2026-10-13"
scope = "cabinet-us"
note = "Read from footage in one pass by one reader; not yet re-read independently. Read in two recordings. Happy & Prosperous, Panda Magic and Autumn Moon show the same pay table under different artwork, and it is the one quoted without a title in the complaint. The pay table as displayed on an Australian machine has not been found. No Australian observation of a pay was read for this title."

