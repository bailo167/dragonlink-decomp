accessed = "2026-10-13"
scope = "cabinet-au"
note = "Read from footage in one pass by one reader; not yet re-read independently. Seen in every Australian recording read. Also stated for the US family in the complaint (para 97)."

[[claim]]
id = "lines"
statement = "Lines are chosen by the player, up to a maximum set by the denomination."
value = "largest seen: 50 at 1c and 2c, 25 at 5c and 10c, 5 at $1"
confidence = "strong_evidence"
source = "gameplay_recording"
citation = "Public recordings, YouTube ids and times: XP7TKGqq7zM 0:05, 9:11, 9:40; uXp_uWK4OH8 1:35, 3:25; DWBTkIVcHNM 11:30, 21:15 (docs/reverse-engineering/FOOTAGE.md)"
accessed = "2026-10-13"
scope = "cabinet-au, Queensland clubs"
note = "Read from footage in one pass by one reader; not yet re-read independently. Recordings of 2022, 2023 and 2026 agree. Payline shapes are not found. See claims/family.toml, structure.lines-au and structure.lines-by-denomination-au. The US rules page says 50 lines are played."

[[claim]]
id = "symbols"
statement = "The symbol set, described in our words from the US rules screens."
