name: CI

# CI is a second opinion on other machines. It does not replace the Windows gate
# (tools/dev/gate.ps1), which runs on the project's Windows host before every merge to main.
# CI never has source material: everything here runs on synthetic fixtures only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Let main runs finish (and save their caches); only PR runs are superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The toolchain is pinned (rust-toolchain.toml and here) so new clippy lints arrive only
# with a deliberate bump.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # CI only needs to compile and test; skipping debuginfo cuts Bevy build/link time a lot.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  hygiene:
    name: Hygiene + progress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: hygiene
          cache-on-failure: true
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Repository hygiene (no source material / RE dumps / secrets / private paths)
        run: cargo run --locked -p repo-hygiene
      - name: Progress tracker valid and generated output fresh
        run: cargo run --locked -p progress-gen -- --check

  build:
    name: ${{ matrix.os }}
    needs: hygiene
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - name: Linux system dependencies (Bevy)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (headless crates and tools)
        run: cargo test --workspace --locked
      - name: Report host target
        shell: bash
        run: rustc -vV | grep host

  web:
    name: Web (wasm32)
    needs: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
          cache-on-failure: true
      - name: The simulation and its data model compile for the web target
        run: cargo build --locked --target wasm32-unknown-unknown -p dragonlink-model -p dragonlink-core
