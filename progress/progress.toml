[[category]]
id = "gc"
name = "Golden Century"

[[category.item]]
id = "identity"
name = "Title identity, versions and regulatory identifiers"
status = "implemented"
evidence = "docs/reverse-engineering/REGULATORY.md; AUSTRALIAN_CONFIGURATION.md"
note = "ACT specifications across generations, Victorian builds, US personality identifiers and the 2016 Australian launch are recorded. NSW and Queensland approvals are not public; what changed between generations is unknown."

[[category.item]]
id = "layout"
name = "Reel layout and lines"
status = "partial"
note = "Australia (Queensland clubs): five by three; lines chosen by the player up to 50 at 1c and 2c, 25 at 5c and 10c, 5 at $1; the shapes of lines 1 to 5 established from win messages. Lines 6 to 50 not found."

[[category.item]]
id = "symbols"
name = "Symbol set"
status = "partial"
note = "Symbol set described from Australian play in public footage; roles of scatter, wild, prize symbol and mystery symbol observed. No rules text found, so the set may be incomplete. No artwork held."

[[category.item]]
id = "paytable"
name = "Paytable"
status = "partial"
note = "Sixteen pay-table entries read from win messages in one transcribed Australian session, one of them differing between $1 and the cent denominations, and checked against a separate reading of the credit meter: 221 of 221 $1 games paid exactly what they give (docs/reverse-engineering/GOLDEN_CENTURY_SESSION.md). Incomplete; no rules screen found."

[[category.item]]
id = "bets"
name = "Denominations and bet options"
status = "partial"
note = "Denominations, the credit conversion, and the bets of one session read from footage (credits per line by denomination). The full ladder per denomination is not shown in any recording."

[[category.item]]
id = "reel-strips"
name = "Reel strips and weighting"
status = "not_started"

[[category.item]]
id = "hold-and-spin"
name = "Hold & Spin rules and presentation"
status = "investigating"
note = "Australia, from public footage: six prize symbols trigger; spins-remaining and collected-of-fifteen counters; prizes in credits or a level's name, tallied at the end. No rules text for this title; value set and weights unknown. Not implemented to these observations."

[[category.item]]
id = "jackpots"
name = "Jackpot levels and presentation"
status = "investigating"
note = "Australia, from public footage: Grand and Major are running meters; Mini and Minor are fixed per denomination (1,000 and 5,000 credits up to 10c; 250 and 1,250 at $1). Strong evidence the Grand is linked and the Major stand-alone. Start-up values, rates and ceilings not public. Not implemented."

[[category.item]]
id = "free-games"
name = "Free games feature"
status = "partial"
note = "Australia: three scatters award six free games; mystery symbols land in blocks and reveal one symbol (public footage, agreeing with the manufacturer's page). Retrigger not seen. Not implemented."

