[[category.item]]
id = "paytable"
name = "Paytable"
status = "partial"
note = "Sixteen pay-table entries read from win messages in one transcribed Australian session, one of them differing between $1 and the cent denominations, and checked against a separate reading of the credit meter: 221 of 221 $1 games paid exactly what they give (docs/reverse-engineering/GOLDEN_CENTURY_SESSION.md). Incomplete; no rules screen found."

[[category.item]]
id = "bets"
name = "Denominations and bet options"
status = "partial"
note = "Two presentations read from footage: Australian club machines (a chooser asking ARE YOU SURE?, credits keys that select and lines keys that play, ladders per denomination) and a casino style (Bet Multiplier, fixed lines, bet keys that play) seen at The Star and, mostly, on a US machine. By market: Queensland clubs 1c-$1, NSW and ACT clubs with $2 (the manufacturer's listing and footage), The Star 5c 10c 25c 50c $1 $2 with 50 fixed lines (VERIFIED denominations; 50 lines STRONG at three of them); the app holds these as a table. The credits row at 5c and 10c, any Australian casino deck and Dragon Link's own gamble count are not legible (docs/reverse-engineering/GOLDEN_CENTURY_CABINET_DECK.md)."

[[category.item]]
