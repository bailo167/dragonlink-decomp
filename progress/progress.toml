name = "Reel strips and weighting"
status = "not_started"

[[category.item]]
id = "hold-and-spin"
name = "Hold & Spin rules and presentation"
status = "partial"
note = "Presentation follows the official app recording step by step (trigger, respins, counter, payout and its music) and club cabinet footage where it differs: one fire into the board with no medallion, PRESS START FEATURE BUTTON blinking, the first respin 0.59 s after the count, a blue-white flash on the 3, thin pale row lines, the cabinet's status line, every tally on a WINNER box over the jackpot bar at the cabinet's pace, a white banner amount (docs/reverse-engineering/GOLDEN_CENTURY_PRESENTATION.md). Rules, values and weights are synthetic."

[[category.item]]
id = "jackpots"
name = "Jackpot levels and presentation"
status = "partial"
note = "Australia, from public footage: Grand and Major are running meters; Mini and Minor are fixed per denomination (1,000 and 5,000 credits up to 10c; 250 and 1,250 at $1). Strong evidence the Grand is linked and the Major stand-alone. Start-up values, rates and ceilings not public. Implemented: the Mini and Minor footage values by denomination; Major and Grand meters the core pays and restarts and the app climbs at the club machines' order of rate, rolling changed figures as filmed, the Grand restarting at $10,000 as filmed; each jackpot's chance the stake over its prize, so the return is about 90% at every bet (the national standard's rule); through Hold & Spin the cabinet's COLLECTED disc with the corner jackpots, a Major first on its own plaque, the Grand under the fire with its status and attendant lines. The meters' openings, exact rates, the Major's restart and the ceilings, the chances and the odds are synthetic; presentation not compared side by side."

[[category.item]]
id = "free-games"
name = "Free games feature"
status = "partial"
note = "Three scatters award six free games; mystery doors reveal one symbol, the emperor and the coin among them (help screen); revealed coins carry prizes and six or more start Hold & Spin inside the free games, which then carry on (cabinet footage, STRONG); retriggers add three (owner). Presentation follows the official app recording (trigger sequence, a win's pace) and club cabinet footage where it differs (the trigger's status and message rows, the prompt with the scatter count, the 0.52 s start, the counter from 1 OF 0, the doors 0.30 s after the rest with the wins at + 1.5 s and a no-win game's next spin at + 2.0 s, the WIN banner only for big wins with a 10x limit that is HYPOTHESIS, the resume after a Hold & Spin inside, FEATURE COMPLETED after the last count with CREDIT held: y8c8lEdPW8Y, 1bAevGz0K2k). Strips and weights are synthetic."

[[category.item]]
id = "art-ui"
name = "Title artwork, UI layout and typography"
status = "partial"
note = "The app renders Golden Century with the authentic art, animations and sound of the owner's mobile build from a local, ignored pack (never committed), in the cabinet frame the owner chose. Gameplay presentation follows the official app recording; not compared side by side throughout."

[[category.item]]
id = "audio"
name = "Sound and music"
status = "implemented"
evidence = "docs/reverse-engineering/GOLDEN_CENTURY_PRESENTATION.md; docs/reverse-engineering/golden-century-sound-cues.md; apps/dragonlink/src/cabinet.rs"
note = "Each sound the app plays is a game clip placed where recordings show it (waveform-matched); placements not evidenced stay silent. Every unplaced clip was searched for in the footage and the scene files; those without a shown placement stay unplaced (GOLDEN_CENTURY_PRESENTATION.md)."

[[category.item]]
id = "animation-timing"
name = "Animation and sequence timing"
status = "implemented"
evidence = "docs/reverse-engineering/GOLDEN_CENTURY_PRESENTATION.md; apps/dragonlink/src/cabinet.rs (TIMING, respins, feature sequences)"
note = "Reels spin and land as 60 fps cabinet footage shows (20 symbols a second, reels 0.45 s apart, through the stop to 0.65, back to 0.40, an 8-frame slide), measured on a muted capture of the app; results, free games, Hold & Spin and its payout follow timings measured frame by frame on the official app."

[[category.item]]
id = "attract"
name = "Attract / idle mode"
status = "implemented"
evidence = "apps/dragonlink/src/cabinet.rs (attract_timer, attract_bar, tests); docs/reverse-engineering/GOLDEN_CENTURY_CABINET_DECK.md (Attract and idle)"
note = "At zero credit the GAMES MENU opens after 30 s idle (HYPOTHESIS: the framework default); on every chooser, attract's or a GAMES MENU touch's, its top-screen PLAY plaque steps through the market's denominations with their Minor and Mini as club footage shows (VERIFIED timing; the casino market's HYPOTHESIS), the values clear of the plaque, fire round the boxes. Not compared side by side throughout."

