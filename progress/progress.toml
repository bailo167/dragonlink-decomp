# --------------------------------------------------------------------------
# Mathematics and analysis
#
# An end-state of its own: explain quantitatively, from evidence, how the real
# games behave. The first items are our tooling (tested on the synthetic
# fixture). The rest are knowledge about the originals, and stay blocked or
# open until a mathematics source exists. See docs/reverse-engineering/math/.
# --------------------------------------------------------------------------

[[category]]
id = "math"
name = "Mathematics and analysis"

[[category.item]]
id = "provenance"
name = "Per-constant provenance model"
status = "implemented"
evidence = "crates/dragonlink-math/src/config.rs (tests); docs/reverse-engineering/math/PROVENANCE.md"

[[category.item]]
id = "config-format"
name = "Machine-readable game configuration"
status = "implemented"
evidence = "crates/dragonlink-math/src/config.rs (tests); docs/reverse-engineering/math/CONFIGURATION.md"
note = "Exercised only on the synthetic fixture. Cannot yet express free games, feature reels, weighted stops or progressive meters."

[[category.item]]
id = "exact-base"
name = "Exact base-game analysis (line and scatter return, composition)"
status = "implemented"
evidence = "crates/dragonlink-math/src/exact.rs (tests: hand arithmetic; frequency method equals full enumeration)"

[[category.item]]
id = "exact-feature"
name = "Exact Hold & Spin analysis (trigger, outcome distribution, value, jackpot frequency)"
status = "implemented"
evidence = "crates/dragonlink-math/src/exact.rs (tests: recursion against hand-computed cases)"
note = "For the generic one-chance-per-position feature model; the original feature mechanics are unknown."

[[category.item]]
id = "enumeration"
name = "Hit frequency and base-game variance by enumeration"
status = "implemented"
evidence = "crates/dragonlink-math/src/exact.rs (tests)"

[[category.item]]
id = "monte-carlo"
name = "Seeded Monte Carlo with confidence intervals"
status = "implemented"
evidence = "crates/dragonlink-math/src/sim.rs (tests: agrees with exact analysis over 400,000 spins)"

[[category.item]]
id = "progressive-ev"
name = "Progressive jackpot expected-value calculator"
status = "implemented"
evidence = "crates/dragonlink-math/src/progressive.rs (tests: return is exactly 1 at the break-even meter)"
note = "Assumes probabilities independent of the meters. No meter model yet."

[[category.item]]
id = "compare"
name = "Configuration and version comparison"
status = "implemented"
evidence = "crates/dragonlink-math/src/compare.rs (tests); dragonlink-analyze compare-games"

[[category.item]]
id = "report"
