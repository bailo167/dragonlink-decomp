# --------------------------------------------------------------------------
# Packaging
# --------------------------------------------------------------------------

[[category]]
id = "packaging"
name = "Packaging"

[[category.item]]
id = "source-importer"
name = "Source importer"
status = "partial"
note = "Stages 1 and 2: standard media found loose, or as entries of ZIP-family archives, is taken into the asset set unchanged with its provenance and hashes; archive entries only when their size and CRC-32 verify, within a decompression budget. Dry-run on a held package read fourteen archives with no entry failing. No proprietary container is unpacked, nothing is converted, and nothing is identified as a particular asset."

[[category.item]]
id = "asset-manifest"
name = "Asset manifest"
status = "implemented"
evidence = "crates/dragonlink-assets (tests); docs/SOURCES.md"
note = "Logical id, source package and path, both hashes, media type, title, category, provenance class, confidence, method. Verified against files; exercised with synthetic files only."

[[category.item]]
id = "local-package"
name = "Local full-package workflow"
status = "partial"
note = "dragonlink-pack verifies an asset set and assembles executable, assets and a do-not-distribute notice outside any Git tree. Exercised end to end with synthetic files; the application cannot display imported assets yet."

[[category.item]]
id = "asset-free-build"
name = "Public asset-free build"
status = "partial"
note = "The app runs with no assets in a clearly labelled placeholder mode. No packaged release yet."

