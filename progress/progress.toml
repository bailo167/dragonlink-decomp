# --------------------------------------------------------------------------
# Parity
# --------------------------------------------------------------------------

[[category]]
id = "parity"
name = "Parity"

[[category.item]]
id = "trace-format"
name = "Behavioural trace format"
status = "implemented"
evidence = "crates/dragonlink-trace (tests); docs/PARITY.md"
note = "One JSON Lines format for rewrite traces and transcribed observations; headers that would mislead are refused. No observation trace exists yet."

[[category.item]]
id = "source-recordings"
name = "Source recordings of the original"
status = "partial"
note = "Public cabinet recordings of all four titles held privately with hashes; one Australian Golden Century session transcribed. The owner's own recording of the official mobile app (3:41 with sound, six excerpts) is the gameplay presentation reference. No recording is tied to a regulatory build."

[[category.item]]
id = "capture-tooling"
name = "Recording to observation trace"
status = "implemented"
evidence = "tools/dragonlink-capture (tests); crates/dragonlink-trace/src/transcript.rs (tests); docs/PARITY.md"
note = "Rest moments are found in a recording and a still cut for each; a sheet of transcribed windows becomes an observation trace of one configuration, with nothing filled in and the meters checked against each other. The detector was run on one hand-held recording of a cabinet (583 games in 53 minutes). Reading the stills is not automated."
[[category.item]]
id = "event-comparison"
name = "Event comparison"
status = "implemented"
evidence = "crates/dragonlink-trace (compare; tests); tools/dragonlink-trace"
note = "Event-by-event comparison that states what kind of comparison it is. Exercised on rewrite traces and on a rewrite relabelled as an observation; never on a real observation."

[[category.item]]
id = "observation-replay"
name = "Replay of observed outcomes"
status = "implemented"
evidence = "crates/dragonlink-trace/src/replay.rs (tests); tools/dragonlink-trace (replay)"
note = "The outcomes a trace shows are scripted through the simulation, so that what still differs is a difference in rules and not in luck; hidden choices and impossible observations are reported. Tested on rewrite traces relabelled as observations only: no observation of an original exists, and through the synthetic fixture a replay tests this machinery and nothing else."
[[category.item]]
id = "timing-comparison"
name = "Timing comparison"
status = "partial"
note = "Timings in the official app recording are measured frame by frame and the app's timed runs compared with them by hand (docs/reverse-engineering/GOLDEN_CENTURY_PRESENTATION.md); no automated trace comparison yet."

[[category.item]]
id = "visual-comparison"
name = "Visual comparison"
status = "partial"
note = "Frames of the app's unattended runs are captured and compared with recording frames by eye; no automated comparison."

[[category.item]]
id = "audio-comparison"
name = "Audio comparison"
status = "partial"
note = "Sounds in recordings are identified by waveform cross-correlation with the game's clips, with control windows (private tooling); not yet automated against the app's output."

[[category.item]]
id = "deterministic-replay"
name = "Deterministic replay"
status = "implemented"
evidence = "crates/dragonlink-core/src/game.rs (a_recorded_game_replays_event_for_event)"
note = "A recorded game of ours replays event for event from its draw log. This is determinism of our code, not parity."

[[category.item]]
id = "parity-tests"
name = "Evidence-backed parity tests"
status = "not_started"

