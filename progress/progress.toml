note = "Five by three. Club machines: lines chosen on the deck, 1/5/10/30/50 at 1c and 2c, 1/5/10/20/25 at 10c, 1 to 5 at $1. Casino style: lines fixed (50 at The Star; 50/50/25/5 by denomination on a US machine). The shapes of lines 1 to 5 established from win messages; lines 6 to 50 not found."

