[[category]]
id = "runtime"
name = "Shared game runtime"

[[category.item]]
id = "rng"
name = "Outcome source abstraction (test, record, replay)"
status = "implemented"
evidence = "crates/dragonlink-core/src/rng.rs (tests)"
note = "Test instruments of ours. Models nothing about the original generator, which is unknown."

[[category.item]]
id = "state-machine"
name = "State machine"
status = "partial"
note = "Idle, free-games and Hold & Spin phases and the gamble, with transactional commands; the gambles allowed in a row are the machine's configuration passed in (GameConfig; five by default, the national standard's most), the engine saying when they are used up. No attract or idle states."

[[category.item]]
id = "credits"
name = "Credits / play-credit model"
status = "partial"
note = "A play-credit meter with chained credit events. A denomination change recounts the credits so the money is unchanged, holding what does not make a whole credit (ChangeDenomination, tested). Cash handling (notes, tickets, collect) is not modelled."

[[category.item]]
id = "bet-selection"
name = "Bet selection"
status = "implemented"
evidence = "crates/dragonlink-core/src/game.rs (SetBet/SetLines/SetStake tests); crates/dragonlink-model/src/fixtures.rs"
note = "Credits per line and line counts (SetBet, SetLines, SetStake). The cabinet build holds each market as a row of data (Market): the Queensland clubs (default) and the NSW and ACT clubs with credits keys that select and lines keys that set the lines and play, per-denomination keys from footage; The Star's casino style with 50 fixed lines and bet keys that play; each market's gamble limits (docs/reverse-engineering/GOLDEN_CENTURY_CABINET_DECK.md, Markets). The credits row at 5c and 10c is not legible on footage."

[[category.item]]
id = "spin-lifecycle"
name = "Spin lifecycle"
status = "partial"
note = "Bet, reel stops, awards, feature entry, completion as events; ordering is ours, not evidenced."

[[category.item]]
id = "reel-model"
name = "Reel model"
status = "partial"
note = "Strips with a wrapping window; how the original maps outcomes to stops is unknown."

[[category.item]]
id = "symbol-model"
name = "Symbol model"
status = "partial"
note = "Regular, wild, scatter and orb kinds; title symbol sets are unknown."

[[category.item]]
id = "pay-evaluator"
name = "Pay evaluator"
status = "partial"
note = "Generic left-to-right line rules and scatter pays, each stated in eval.rs; none checked against the original."

[[category.item]]
id = "win-presentation"
name = "Win presentation"
status = "implemented"
evidence = "apps/dragonlink/src/cabinet.rs (win_rollup, win_lines, symbol_fx); apps/dragonlink/src/main.rs (wins_play_the_real_games_tunes)"
note = "Win tunes chosen by the win's size where measured, counts lasting the tune's audible length, lines in turn with their symbols blinking (the club cabinet's two even 0.66 s cycles a line, STRONG), symbol animations, a coin shower for big wins."

[[category.item]]
id = "feature-trigger"
name = "Feature triggering"
status = "partial"
note = "Hold & Spin by orb count, free games by scatter count; a spin that wins both plays Hold & Spin first and then the free games, completing (and offering the gamble) only after both (the owner). The trigger counts are evidenced; the chances are synthetic."

[[category.item]]
id = "hold-and-spin"
name = "Hold & Spin framework"
status = "partial"
note = "Parameterised respin loop with tests; trigger count, respins, chances and values are synthetic."

[[category.item]]
id = "jackpots"
name = "Jackpot model and presentation"
status = "partial"
note = "Four tiers on a jackpot bar, awarded in Hold & Spin (full grid awards the Grand). Golden Century: Mini and Minor fixed by denomination as club footage shows them (1,000 / 5,000 credits to 10c, 250 / 1,250 at $1); Major and Grand progressive meters the core pays and restarts, climbing a cent or two every few seconds in the app with rolling figures; the Grand restarts at $10,000 as filmed. Meter openings, exact rates, the Major's restart and the ceilings are synthetic; odds unknown."

[[category.item]]
id = "free-games"
name = "Free-game framework"
status = "implemented"
evidence = "crates/dragonlink-core/src/game.rs (advance_free_games); crates/dragonlink-math/tests/gc_synthetic_plays.rs"
note = "Scatter trigger, an award of free games on their own reels played without a bet, a mystery-symbol reveal (one drawn symbol fills every mystery position), retrigger, and a clean return to the base game. Modelled as FreeGamesModel; the synthetic Golden Century config uses it. The exact free-game strips, reveal weights and retrigger size are synthetic."

[[category.item]]
id = "audio"
name = "Audio"
status = "implemented"
evidence = "apps/dragonlink/src/cabinet.rs (Sounds, reel_audio, feature cues, feature_music, payout)"
note = "Plays clips from the local pack: one-shots, loops, cues scheduled to the presentation, a fade. Placements follow recordings (GOLDEN_CENTURY_PRESENTATION.md)."

[[category.item]]
id = "animation"
name = "Animation"
status = "implemented"
evidence = "apps/dragonlink/src/cabinet.rs (animate_reels, TIMING; respins)"
note = "Reels at the measured speed, cadence and landing; respin positions as the real game's; feature sequences on measured timings."

[[category.item]]
id = "vfx"
name = "VFX"
status = "implemented"
evidence = "apps/dragonlink/src/cabinet.rs (symbol_fx, wild_talls, door_draw, hold_and_spin_draw, coin_shower, payout_effects)"
note = "The game's own animation sequences: symbol win animations, tall wilds, door reveal, fire rings, bursts, fire transitions, collection comets, coin shower and banner bursts."

[[category.item]]
id = "ui"
name = "UI"
status = "implemented"
evidence = "apps/dragonlink/src/cabinet.rs (spawn_meter_band, spawn_deck, gamble screen); apps/dragonlink/src/main.rs (menu_setup)"
note = "The cabinet screen with the jackpot bar, CREDIT/BET/WIN meters (the club's dollars and credits alternation in PLAY ON, the gamble and after a denomination choice), the club's system messages (gamble notice, win limit, cash-in notice, a stand-in greeting), N LINES boxes, the GAMES MENU denomination chooser laid out as club footage measures it and the gamble screen (nothing of the base screen over it, the club's COLLECT and GAMES MENU kept); the Australian club deck as filmed (GAMBLE over TAKE WIN, credits and lines keys, all lit, the selected lines key light blue; the teardrop pointing up, dark but for START FEATURE, with PLAY/REPEAT BET/START FEATURE/SPIN; GOOD LUCK wiping in and out on every spin and respin, CHOOSE; the 1 Hz flash; the gamble's lattice keys and lattice teardrop), or the casino style, each market's own (DRAGONLINK_MARKET); the gamble's endings including the limit's; a four-title launcher. Not compared side by side throughout (docs/reverse-engineering/GOLDEN_CENTURY_CABINET_DECK.md)."

[[category.item]]
id = "input"
name = "Input"
status = "implemented"
evidence = "apps/dragonlink/src/cabinet.rs (deck buttons); apps/dragonlink/src/main.rs (input)"
note = "Deck keys and touch-screen tabs by pointer, and the keyboard: credits and lines keys (club) or bet keys (casino), PLAY, the GAMES MENU with its confirmation, gamble choices on keys and screen, half gamble, take win; a spin is refused until the reels are still. No autoplay or settings menu yet."

[[category.item]]
id = "save-settings"
name = "Save and settings handling"
status = "partial"
note = "Game state serialises and resumes mid-feature; no settings, no persistence in an app."

