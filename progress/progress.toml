name = "Recovered configuration: Autumn Moon"
status = "investigating"
note = "No source held. An online evidence pass over litigation, regulatory, archival and research sources is under way (docs/BLOCKERS.md); it is not treated as blocked until those are exhausted."

[[category.item]]
id = "visible-paytables"
name = "Player-visible pay tables, lines and bet structures"
status = "partial"
note = "US pay tables and Hold & Spin rules of three titles transcribed from machines' rules screens in public footage; Australian lines by denomination, fixed prize values and free-games awards read from play for all four. No pay table for Golden Century, no Australian rules screen, no full bet ladder and no return figure were found (docs/reverse-engineering/FOOTAGE.md)."

[[category.item]]
id = "denomination-bet-effects"
name = "Denomination and bet effects"
status = "investigating"
note = "First direct observation on an Australian Dragon Link machine: Golden Century at $1 shows different reel windows and one different pay from the 1c to 10c games, which are consistent with one configuration; changing lines does not change the reels (docs/reverse-engineering/GOLDEN_CENTURY_SESSION.md). Inferred statistically from one session. Lightning Link return by denomination and the regulatory limits are in PUBLISHED_RETURNS.md. No return figure for Dragon Link in Australia."

[[category.item]]
id = "version-differences"
name = "Mathematical differences between program versions"
status = "investigating"
note = "Identifiers of every Australian generation and of US builds are recorded, and the manufacturer says dozens of iterations share a similar design (LITIGATION.md). What differs is not public."

[[category.item]]
id = "rng-architecture"
name = "RNG architecture and call sites"
status = "investigating"
note = "Mobile: the generator family and the unbiased bounded draw are known from static analysis of the app (MOBILE_MATH_ARCHITECTURE.md); seeding is recorded privately and not published (DECISIONS D-016). Cabinet: regulatory requirements by revision are documented; the product's algorithm, seeding and call sites are not public."

[[category.item]]
id = "outcome-selection"
name = "Outcome selection, reel-stop relationship and input timing"
status = "investigating"
note = "Mobile: the order of a round is known from static analysis: stops, prize-symbol values over the whole strip, window, evaluation, then features (MOBILE_MATH_ARCHITECTURE.md). Cabinet: regulation requires the outcome before presentation and forbids timing from changing the distribution; not verified in any cabinet software."

[[category.item]]
id = "state-dependence"
name = "State dependence and persistence between spins"
status = "investigating"
note = "Mobile: the state carried inside Hold & Spin is known (held symbols, count, one specially weighted position); no state carried between base games was found in the code examined, which is not proof of absence. Cabinet: regulation permits only declared tokens and progressive pools; not verified in software."

[[category.item]]
id = "mobile-vs-cabinet"
name = "Mobile versus cabinet mathematics"
status = "investigating"
note = "The mobile algorithms are described and their numbers unread; the cabinet has pay entries and reel windows from footage and no algorithm. They agree on what both show (Hold & Spin counts, the free-games reveal). The mobile engine can select reels by bet configuration, and a cabinet used different reels at $1: a resemblance. No table can be compared yet."

[[category.item]]
id = "progressive-thresholds"
name = "Progressive break-even thresholds of the originals"
status = "investigating"
note = "No source held. An online evidence pass over litigation, regulatory, archival and research sources is under way (docs/BLOCKERS.md); it is not treated as blocked until those are exhausted."

[[category.item]]
id = "beliefs"
name = "Classification of player beliefs against evidence"
status = "not_started"
note = "Classes defined in docs/reverse-engineering/math/QUESTIONS.md; none can be judged without a recovered configuration."

