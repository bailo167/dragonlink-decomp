# --------------------------------------------------------------------------
# Reverse engineering
# --------------------------------------------------------------------------

[[category]]
id = "re"
name = "Reverse engineering"

[[category.item]]
id = "platform-research"
name = "Dragon Link cabinet and platform research"
status = "implemented"
evidence = "docs/reverse-engineering/PLATFORMS.md; PLATFORM_SOFTWARE.md; AUSTRALIAN_CONFIGURATION.md"
note = "Generations, base-software lineage and the launch cabinets are documented from regulators' records and the manufacturer's archived pages. The internals of Gen8 and later are not public."

[[category.item]]
id = "regulatory-inventory"
name = "Regulatory source inventory"
status = "implemented"
evidence = "docs/reverse-engineering/REGULATORY.md; PUBLISHED_RETURNS.md; AUSTRALIAN_CONFIGURATION.md"
note = "ACT register swept 2016 to 2026; Victoria and one US regulator mined; the national standard's requirements recorded. No title-level register exists publicly for NSW, Qld, SA, Tas, NT or WA. No Australian return figure for Dragon Link exists publicly."

[[category.item]]
id = "mobile-inventory"
name = "Official mobile reference inventory"
status = "partial"
note = "Mighty Fu Casino 5.6.0 obtained from the Play Store, hashed and inventoried, with the content it downloaded for Golden Century (docs/reverse-engineering/MOBILE_PACKAGE.md). The downloaded packages of all four titles in scope, and of four further Dragon Link titles, are held."

[[category.item]]
id = "provenance-db"
name = "Source provenance database (claims)"
status = "implemented"
evidence = "crates/dragonlink-model/claims/ (136 claims); crates/dragonlink-model/src/claims.rs (tests enforce the evidence rules)"

[[category.item]]
id = "format-id"
name = "Package and file-format identification"
status = "partial"
note = "Tools exist and have been run on a real package: Unity IL2CPP identified; two unfamiliar formats measured, a MERC container and an .enc family consistent with a block cipher. Neither is understood yet."

[[category.item]]
id = "exe-analysis"
name = "Executable analysis"
status = "partial"
note = "The app's large native library is identified as the manufacturer's native game runtime (one pass). The IL2CPP side is unexamined. Analysis of the protection on the game tables was stopped (BLOCKERS B-005)."

[[category.item]]
id = "asset-containers"
name = "Asset-container identification"
status = "partial"
note = "The MERC container is understood by a private parser that reads every such file of eight titles. A private exporter (outside Git) takes Golden Century's art, animation sequences and sound into a local, ignored pack the app loads; the repository's own importer does not do this yet."

[[category.item]]
id = "textures"
name = "Texture and image extraction"
status = "partial"
note = "Golden Century's textures (raw RGBA and ETC1) and sprite cuts are decoded by the private exporter into the local pack. Not a committed tool."

[[category.item]]
id = "fonts"
name = "Font identification"
status = "not_started"

[[category.item]]
id = "audio"
name = "Audio extraction"
status = "partial"
note = "Golden Century's 114 Ogg clips, the seven sister titles' clips and the app's shared sound bank (three payout tracks) are carved by private tooling into the local pack. Not a committed tool."

[[category.item]]
id = "animation"
name = "Animation extraction"
status = "partial"
note = "Golden Century's image sequences and alpha video animations are exported by private tooling to frame folders in the local pack. Not a committed tool."

[[category.item]]
id = "config-data"
name = "Configuration and data extraction"
status = "blocked"
blocker = "The mobile build's tables are on the device in protected files; reading them was stopped by the tooling's safety controls and is not worked around (docs/BLOCKERS.md B-005)."

[[category.item]]
id = "math-model"
name = "Mathematical-model investigation"
status = "investigating"
note = "No cabinet mathematics is held and none is public. The mobile build's tables are held but protected and unread (BLOCKERS B-005); it is established that the four titles are two pairs sharing their tables in that build. A public-sources pass is running."

