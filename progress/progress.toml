# dragonlink-decomp progress — the canonical source of truth.
#
# Statuses: not_started | investigating | partial | implemented | verified | blocked
# Definitions are in CLAUDE.md ("Progress tracking — no fake progress").
#   * implemented / verified items MUST carry `evidence` (doc, test or tool path).
#   * blocked items MUST carry `blocker`.
#   * `verified` needs external grounding: agreement with evidence about the original
#     (or, for our own tooling, with an independent reference), reproducibly. Compiling,
#     passing our own tests, or looking right never makes an item verified.
#   * An item about the original games is at most `partial` while the mathematics or
#     behaviour it implements is unevidenced, however complete our code is.
# After editing, run `cargo run -p progress-gen` to regenerate progress.svg and
# the README table. CI and the Windows gate run `cargo run -p progress-gen -- --check`.

schema = 1
title = "dragonlink-decomp — preservation progress"
current_milestone = "M1"

# --------------------------------------------------------------------------
# Milestones (the Golden Century acceptance path, then the other titles)
# --------------------------------------------------------------------------

[[milestone]]
id = "M0"
name = "Foundation"
status = "implemented"
note = "Stage A: workspace, hygiene, progress tooling, docs, Windows gate, CI and the source root all exist and work. RE applications are installed when first needed."

[[milestone]]
id = "M1"
name = "Evidence"
status = "partial"
note = "Stage B: regulatory and official sources catalogued, official mobile software inventoried, formats identified."

[[milestone]]
id = "M2"
name = "Import"
status = "partial"
note = "Stage C. Scanner, manifest, normalised layout and two importer stages (loose media, and media inside ZIP-family archives read within a budget) exist and are tested on synthetic files. No proprietary container is unpacked, and no real source material has been imported into an asset set."

[[milestone]]
id = "M3"
name = "Headless game model"
status = "partial"
note = "Stage D: state, spin, awards, feature state machine, deterministic traces. Runs on a synthetic fixture only; original mathematics unknown."

[[milestone]]
id = "M4"
name = "Golden Century Bevy slice"
status = "partial"
note = "Stage E. A placeholder shell runs the synthetic fixture through the real simulation: window, reels, spin, Hold & Spin stepping. Nothing in it is Golden Century yet: no assets, no audio, no title data."

[[milestone]]
id = "M5"
name = "Parity"
status = "not_started"
note = "Stage F: source-vs-rewrite traces, timing, screenshots, animation and audio events, discrepancies tracked."

[[milestone]]
id = "M6"
name = "Portability"
status = "not_started"
note = "Stage G: Windows verified, Linux and macOS build and test, Web/WASM builds and runs."

[[milestone]]
id = "M8"
name = "Game mathematics recovered and explained"
status = "investigating"
note = "Parallel lane. Analysis tooling exists and is tested on the synthetic fixture; no original mathematics is held, and none is public."

[[milestone]]
id = "M7"
name = "Happy & Prosperous, Panda Magic, Autumn Moon"
status = "not_started"
note = "Generalise the systems proven on Golden Century to the other three titles."

