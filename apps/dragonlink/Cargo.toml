[package]
name = "dragonlink"
description = "Dragon Link preservation project — Rust/Bevy application (placeholder mode until assets are imported)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dragonlink-assets.workspace = true
dragonlink-core.workspace = true
dragonlink-model.workspace = true
# 2D and UI only for now. `default_platform` (pulled in by both) brings the
# window backend, the built-in font and WebGL2 for the web target.
bevy = { workspace = true, features = ["2d", "ui"] }

[lints]
workspace = true
