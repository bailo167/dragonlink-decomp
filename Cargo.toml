[workspace]
resolver = "3"
members = [
    "apps/dragonlink",
    "crates/dragonlink-model",
    "crates/dragonlink-core",
    "crates/dragonlink-math",
    "crates/dragonlink-formats",
    "crates/dragonlink-trace",
    "tools/dragonlink-analyze",
    "tools/dragonlink-trace",
    "tools/dragonlink-inventory",
    "tools/progress-gen",
    "tools/repo-hygiene",
]
# The Bevy executable is a workspace member but not a default member: plain
# `cargo test` / `cargo build` cover the headless crates and tools quickly.
# The gate builds the app explicitly (`cargo build -p dragonlink`).
default-members = [
    "crates/dragonlink-model",
    "crates/dragonlink-core",
    "crates/dragonlink-math",
    "crates/dragonlink-formats",
    "crates/dragonlink-trace",
    "tools/dragonlink-analyze",
    "tools/dragonlink-trace",
    "tools/dragonlink-inventory",
    "tools/progress-gen",
    "tools/repo-hygiene",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bailo167/dragonlink-decomp"
publish = false

[workspace.dependencies]
# Internal crates
dragonlink-model = { path = "crates/dragonlink-model" }
dragonlink-core = { path = "crates/dragonlink-core" }
dragonlink-math = { path = "crates/dragonlink-math" }
dragonlink-formats = { path = "crates/dragonlink-formats" }
dragonlink-trace = { path = "crates/dragonlink-trace" }

# External (pinned exactly; bump deliberately, one at a time)
bevy = { version = "=0.20.0", default-features = false }
clap = { version = "=4.6.7", features = ["derive"] }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.8"
sha2 = "=0.11.0"
walkdir = "=2.5.0"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
indexing_slicing = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
